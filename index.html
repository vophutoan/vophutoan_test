<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bao xoài Thúy Lan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Thư viện PapaParse dùng để đọc file CSV từ Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 pb-24">

    <!-- Header / Hero Section (Giữ nguyên) -->
    <header class="relative bg-green-700 text-white overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1601493700631-2b16ec4b4716?q=80&w=2000&auto=format&fit=crop" alt="Vườn Xoài" class="w-full h-full object-cover opacity-80" />
            <div class="absolute inset-0 bg-black/60 bg-gradient-to-t from-gray-900 to-transparent"></div>
        </div>
        <div class="relative z-10 container mx-auto px-4 py-12 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-3 text-yellow-400 drop-shadow-md">ĐẠI LÝ BAO BÌ PHÚ TOÀN</h1>
            <p class="text-xl md:text-2xl mb-6 font-semibold">Chuyên sỉ & lẻ các loại bao bọc xoài</p>
            <div class="inline-block bg-yellow-400/90 backdrop-blur-sm text-green-900 font-bold px-6 py-2 rounded-full shadow-lg border border-yellow-300">
                Cập nhật giá ngày: <span id="currentDate">...</span>
            </div>
        </div>
    </header>

    <!-- Danh sách sản phẩm tự động load từ Google Sheets -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-end mb-6 border-b-2 border-green-600 pb-2">
            <h2 class="text-2xl font-bold text-gray-800">BẢNG GIÁ HÔM NAY</h2>
            <div id="loadingStatus" class="text-sm text-blue-600 animate-pulse font-semibold">Đang tải dữ liệu từ máy chủ...</div>
        </div>

        <!-- Khung chứa sản phẩm -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Sản phẩm sẽ được JavaScript tự động chèn vào đây -->
        </div>
    </main>

    <!-- JavaScript xử lý dữ liệu -->
    <script>
        // Tự động điền ngày hôm nay
        const today = new Date();
        document.getElementById('currentDate').innerText = today.toLocaleDateString('vi-VN');

        // BẠN HÃY DÁN LINK CSV TỪ GOOGLE SHEETS CỦA BẠN VÀO ĐÂY
        const CSV_URL = 'LINK_GOOGLE_SHEET_CSV_CUA_BAN'; 

        // Hàm đọc và hiển thị dữ liệu
        function loadProducts() {
            // Nếu bạn chưa thay link, hiển thị dữ liệu mẫu để bạn hình dung
            if (CSV_URL === 'LINK_GOOGLE_SHEET_CSV_CUA_BAN') {
                document.getElementById('loadingStatus').innerText = "Vui lòng cập nhật link Google Sheets trong code";
                document.getElementById('loadingStatus').classList.replace('text-blue-600', 'text-red-500');
                return;
            }

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const products = results.data;
                    const grid = document.getElementById('productGrid');
                    grid.innerHTML = ''; // Xóa trạng thái tải
                    
                    document.getElementById('loadingStatus').innerText = "Đã cập nhật mới nhất!";
                    document.getElementById('loadingStatus').classList.replace('text-blue-600', 'text-green-600');
                    document.getElementById('loadingStatus').classList.remove('animate-pulse');

                    products.forEach(item => {
                        // Bỏ qua các dòng trống
                        if(!item['Tên sản phẩm']) return;

                        const isOutOfStock = item['Trạng thái'] && item['Trạng thái'].toLowerCase().includes('hết');
                        
                        const cardHTML = `
                            <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col transition transform hover:-translate-y-1 hover:shadow-xl">
                                <div class="bg-green-50 p-4 border-b border-green-100 flex-grow">
                                    <h3 class="text-xl font-bold text-green-800 mb-1 leading-tight">${item['Tên sản phẩm']}</h3>
                                    <p class="text-gray-600 text-sm mt-2">${item['Mô tả'] || 'Đang cập nhật'}</p>
                                </div>
                                <div class="p-4 bg-white text-center">
                                    <div class="text-2xl font-bold text-red-600 mb-3">${item['Giá']}</div>
                                    <button onclick="orderItem('${item['Tên sản phẩm']}')" 
                                        class="w-full ${isOutOfStock ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'} text-white font-bold py-3 px-4 rounded-lg shadow transition"
                                        ${isOutOfStock ? 'disabled' : ''}>
                                        ${isOutOfStock ? 'Tạm Hết Hàng' : 'Đặt Mua Qua Zalo'}
                                    </button>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    });
                }
            });
        }

        function orderItem(itemName) {
            // Chuyển hướng người nông dân mở thẳng Zalo của bạn với tin nhắn soạn sẵn
            const sdtZalo = "0900000000"; // THAY SỐ ĐIỆN THOẠI ZALO CỦA BẠN VÀO ĐÂY
            const message = encodeURIComponent(`Chào Đại lý Phú Toàn, tôi muốn hỏi mua loại: ${itemName}`);
            window.open(`https://zalo.me/${sdtZalo}?text=${message}`, '_blank');
        }

        // Chạy hàm tải dữ liệu khi trang vừa mở
        window.onload = loadProducts;
    </script>
</body>
</html>

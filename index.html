<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Test AI - Cloudflare</title>
    <style>
        :root {
            --primary-color: #f38020; /* Màu cam đặc trưng của Cloudflare */
            --bg-color: #f4f6f8;
            --chat-bg: #ffffff;
            --text-color: #333;
            --user-msg: #e3f2fd;
            --ai-msg: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 85vh;
            overflow: hidden;
        }
        .header {
            background: var(--primary-color);
            color: white;
            padding: 16px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 0;
        }
        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 0;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 24px;
            outline: none;
            font-size: 1rem;
            transition: border 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #e67300;
        }
        .loading {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            Cloudflare Workers AI - Demo
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message ai">
                Chào bạn! Tôi là giao diện thử nghiệm. Bạn có thể kết nối tôi với Cloudflare Workers AI (ví dụ: mô hình Llama-3) để trò chuyện thực tế. Hãy nhập thử tin nhắn bên dưới nhé!
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Nhập câu hỏi của bạn..." autocomplete="off">
            <button onclick="sendMessage()" id="send-btn">Gửi</button>
        </div>
    </div>

    <script>
        // CẤU HÌNH API
        // Khi bạn đã tạo một Cloudflare Worker xử lý AI, hãy điền đường link Worker đó vào đây.
        // Nếu để trống, web sẽ chạy ở chế độ mô phỏng (dành cho việc test giao diện).
        const CLOUDFLARE_WORKER_API = ""; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Lắng nghe sự kiện nhấn phím Enter
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. In tin nhắn của người dùng ra màn hình
            appendMessage(text, 'user');
            userInput.value = '';
            
            // Khóa input trong lúc chờ AI phản hồi
            userInput.disabled = true;
            sendBtn.disabled = true;

            // 2. Hiển thị trạng thái "đang tải"
            const loadingId = 'loading-' + Date.now();
            appendLoading(loadingId);

            // 3. Gửi dữ liệu tới API
            try {
                let aiResponse = "";

                if (CLOUDFLARE_WORKER_API === "") {
                    // CHẾ ĐỘ MÔ PHỎNG (Chạy test giao diện trực tiếp trên Pages)
                    await new Promise(resolve => setTimeout(resolve, 1500)); // Mô phỏng độ trễ 1.5s
                    aiResponse = "Đây là phản hồi mô phỏng (Mock Response). Để chạy AI thật, bạn hãy viết một Cloudflare Worker bằng JavaScript sử dụng `env.AI.run('@cf/meta/llama-3-8b-instruct')`, deploy nó, và gắn link Worker đó vào biến `CLOUDFLARE_WORKER_API` trong mã nguồn HTML này nhé.";
                } else {
                    // CHẾ ĐỘ API THỰC TẾ
                    const response = await fetch(CLOUDFLARE_WORKER_API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: text })
                    });
                    
                    if (!response.ok) throw new Error("Lỗi kết nối đến server Cloudflare Worker.");
                    
                    const data = await response.json();
                    // Điều chỉnh data.response tùy theo định dạng JSON mà Worker của bạn trả về
                    aiResponse = data.response || "Không nhận được nội dung trả về."; 
                }

                // Xóa dòng "đang tải" và in kết quả
                removeLoading(loadingId);
                appendMessage(aiResponse, 'ai');

            } catch (error) {
                removeLoading(loadingId);
                appendMessage("❌ Đã có lỗi xảy ra: " + error.message, 'ai');
            } finally {
                // Mở khóa input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Tự động cuộn xuống cuối
        }

        function appendLoading(id) {
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.classList.add('message', 'ai', 'loading');
            msgDiv.textContent = 'AI đang suy nghĩ...';
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
